[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Vite is a single-page app. Let Netlify serve index.html for client-side routes
# such as /anime, while keeping Netlify Functions under /.netlify/functions/.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
